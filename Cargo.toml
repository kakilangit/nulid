
[package]
name = "nulid"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
description = "Nanosecond-Precision Universally Lexicographically Sortable Identifier"
documentation = "https://docs.rs/nulid"
homepage = "https://github.com/kakilangit/nulid"
repository.workspace = true
readme = "README.md"
license.workspace = true
keywords = ["ulid", "uuid", "identifier", "sortable", "timestamp"]
categories = ["data-structures", "encoding", "date-and-time"]
[workspace]
members = [".", "nulid_derive", "nulid_macros"]
resolver = "2"

[workspace.lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("serde", "uuid", "sqlx", "sqlx-postgres", "sqlx-sqlite", "sqlx-mysql", "postgres-types", "chrono", "jiff", "wasm"))'] }

[workspace.package]
version = "0.10.0"
edition = "2024"
rust-version = "1.88"
authors = ["kakilangit <crates@kakilangit.dev>"]
license = "MIT"
repository = "https://github.com/kakilangit/nulid"
homepage = "https://github.com/kakilangit/nulid"

[workspace.dependencies]
nulid_derive = { version = "0.10", path = "./nulid_derive" }
nulid_macros = { version = "0.10", path = "./nulid_macros" }

[[bin]]
name = "nulid"
path = "src/bin/nulid.rs"
required-features = ["cli"]

[features]
default = ["std"]
std = []
cli = ["uuid", "chrono"]
full = ["derive", "macros", "serde", "uuid", "sqlx", "postgres-types", "rkyv", "chrono", "jiff"]
wasm = ["getrandom/wasm_js", "web-time"]
derive = ["dep:nulid_derive"]
macros = ["dep:nulid_macros"]
serde = ["dep:serde", "nulid_derive?/serde"]
uuid = ["dep:uuid", "nulid_derive?/uuid"]
# SQLx database-specific features (use these for individual database support)
sqlx-postgres = ["dep:sqlx-core", "dep:sqlx-postgres", "uuid", "nulid_derive?/sqlx-postgres"]
sqlx-sqlite = ["dep:sqlx-core", "dep:sqlx-sqlite", "nulid_derive?/sqlx-sqlite"]
sqlx-mysql = ["dep:sqlx-core", "dep:sqlx-mysql", "nulid_derive?/sqlx-mysql"]
# Convenience feature that enables all databases (requires all DB drivers)
sqlx = ["sqlx-postgres", "sqlx-sqlite", "sqlx-mysql"]
postgres-types = ["dep:postgres-types", "dep:bytes", "nulid_derive?/postgres-types"]
rkyv = ["dep:rkyv"]
chrono = ["dep:chrono", "nulid_derive?/chrono"]
jiff = ["dep:jiff", "nulid_derive?/jiff"]

[dependencies]
bytes = { version = "1.11", optional = true }
chrono = { version = "0.4", optional = true, default-features = false, features = ["clock", "std"] }
getrandom = { version = "0.3", default-features = false, optional = true }
jiff = { version = "0.2", optional = true, default-features = false }
nulid_derive = { workspace = true, optional = true }
nulid_macros = { workspace = true, optional = true }
postgres-types = { version = "0.2", optional = true }
quanta = "0.12"
rand = "0.9"
rkyv = { version = "0.8", optional = true, default-features = false, features = ["alloc", "bytecheck"] }
serde = { version = "1.0", optional = true, default-features = false, features = ["derive"] }
sqlx-core = { version = "0.8", optional = true, default-features = false }
sqlx-postgres = { version = "0.8", optional = true, default-features = false, features = ["uuid"] }
sqlx-sqlite = { version = "0.8", optional = true, default-features = false, features = ["bundled"] }
sqlx-mysql = { version = "0.8", optional = true, default-features = false }
uuid = { version = "1.19", optional = true, features = ["v4"] }
web-time = { version = "1.1", optional = true }

[build-dependencies]

[dev-dependencies]
bincode = { version = "2.0", features = ["serde"] }
criterion = "0.8"
rmp-serde = "1.3"
serde_json = "1.0"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "postgres", "sqlite", "mysql", "macros"] }
tokio = { version = "1.48", features = ["full"] }
toml = "0.9"

[[example]]
name = "basic"

[[example]]
name = "derive_wrapper"
required-features = ["derive"]

[[example]]
name = "macros"
required-features = ["macros"]

[[example]]
name = "combined_features"
required-features = ["derive", "macros"]

[[example]]
name = "derive_features"
required-features = ["derive", "serde", "uuid", "sqlx-postgres", "postgres-types"]

[[example]]
name = "monotonic"

[[example]]
name = "postgres_types_example"
required-features = ["postgres-types"]

[[example]]
name = "rkyv_example"
required-features = ["rkyv"]

[[example]]
name = "serde_example"
required-features = ["serde"]

[[example]]
name = "sqlx_postgres"
required-features = ["sqlx-postgres"]

[[example]]
name = "sqlx_sqlite"
required-features = ["sqlx-sqlite"]

[[example]]
name = "sqlx_mysql"
required-features = ["sqlx-mysql"]

[[example]]
name = "uuid_conversion"
required-features = ["uuid"]

[[example]]
name = "chrono_example"
required-features = ["chrono"]

[[example]]
name = "jiff_example"
required-features = ["jiff"]

[[example]]
name = "wasm_example"
required-features = ["wasm"]

[[bench]]
name = "nulid_benchmark"
harness = false

[lints.clippy]
panic = "deny"
unwrap_used = "deny"
expect_used = "deny"
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
