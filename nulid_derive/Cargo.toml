[package]
name = "nulid_derive"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
description = "Derive macros for nulid wrapper types"
documentation = "https://docs.rs/nulid_derive"
homepage.workspace = true
repository.workspace = true
license.workspace = true
keywords = ["ulid", "uuid", "identifier", "derive", "macro"]
categories = ["data-structures", "encoding"]

[lib]
proc-macro = true

[features]
# Plain flags: the derive only reads them while expanding, so it needs none of
# these crates itself. `nulid` enables each one together with its own feature.
default = []
serde = []
uuid = []
# SQLx database-specific features
sqlx-postgres = ["uuid"]
sqlx-sqlite = []
sqlx-mysql = []
# Convenience feature that enables all databases
sqlx = ["sqlx-postgres", "sqlx-sqlite", "sqlx-mysql"]
postgres-types = []
chrono = []
jiff = []

[dependencies]
proc-macro2 = "1.0"
quote = "1.0"
syn = { version = "2.0", features = ["full"] }

[dev-dependencies]
bincode = { version = "2.0", features = ["serde"] }
bytes = "1.11"
nulid = { path = "..", features = ["derive", "serde", "uuid", "sqlx", "postgres-types", "chrono", "jiff"] }
postgres-types = "0.2"
serde_json = "1.0"
sqlx = { version = "0.9", default-features = false, features = ["postgres", "sqlite", "mysql"] }
tokio = { version = "1.0", features = ["rt"] }
uuid = { version = "1.0", features = ["v4"] }
