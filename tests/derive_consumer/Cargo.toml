# A crate that uses `#[derive(Id)]` the way downstream crates do: it has no
# features of its own and no direct dependency on serde or uuid. It fails to
# build, or builds without the impls, if the derive emits code that depends on
# the consuming crate's features or dependencies.
[package]
name = "nulid_derive_consumer"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
nulid = { path = "../..", default-features = false, features = ["std", "derive", "serde", "uuid"] }

[dev-dependencies]
serde_json = "1.0"
